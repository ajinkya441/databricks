# This is a Databricks asset bundle definition for project_dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_dabs
  uuid: 47d5f780-bb8e-437b-93c0-8db4b452e106

include:
  - resources/*.yml
  - resources/*/*.yml
  # - resources/setup_tables.job.yml

artifacts:
  python_artifact:
    type: whl
    build: python -m uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: The warehouse to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-50af0417-17a9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/<username> to make sure we only have a single copy.
      root_path: /Workspace/Users/ajinkya441@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: schema_dev
      warehouse_id: 870fb126167bb7a9
  prod:
    mode: production
    workspace:
      host: https://dbc-50af0417-17a9.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: schema_prod
      warehouse_id: 870fb126167bb7a9
    permissions:
      - user_name: ajinkya441@gmail.com
        level: CAN_MANAGE
