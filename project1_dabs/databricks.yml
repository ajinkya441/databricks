# This is a Databricks asset bundle definition for project_dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_dabs
  uuid: 47d5f780-bb8e-437b-93c0-8db4b452e106

include:
  - resources/*.yml
  - resources/*/*.yml
  # - resources/setup_tables.job.yml

artifacts:
  python_artifact:
    type: whl
    build: python -m uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: The warehouse to use
  service_principal_id:
    description: "The client ID of the service principal to run the job as"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      # host: https://dbc-50af0417-17a9.cloud.databricks.com  # Change to dev URL
      # We explicitly deploy to /Workspace/Users/<username> to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: schema_dev
      # warehouse_id: <warehouse_id> # dev
  prod:
    mode: production
    workspace:
      # host: https://dbc-50af0417-17a9.cloud.databricks.com  # Change to prod URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: schema_prod
      # warehouse_id: <warehouse_id> # prod
    permissions:
      - user_name: ${env.USERNAME}
        level: CAN_MANAGE
