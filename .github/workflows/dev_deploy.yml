name: dev deployment

on:
  push:
    branches:
      - main
    paths:
      - 'project1_dabs/**' # depending on the project to deploy

jobs:
  deploy_to_dev:
    name: "Deploy Bundle (DEV)"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - uses: databricks/setup-cli@main
      
      - working-directory: ./project1_dabs # depending on the project to deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_WS_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_WS_DEV }}
          WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID_DEV }}
          USERNAME: ${{ secrets.USERNAME }}
          DATABRICKS_BUNDLE_ENV: dev
        run: |
          databricks bundle validate -t dev \
             --var="service_principal_id=${{ secrets.DATABRICKS_CLIENT_ID_WS_DEV }}"

          databricks bundle deploy -t dev \
             --var="service_principal_id=${{ secrets.DATABRICKS_CLIENT_ID_WS_DEV }}"
